# ════════════════════════════════════════════════════════════════
# monitoring/grafana.yaml
#
# Grafana con el datasource de Prometheus preconfigurado (provisioning
# por ConfigMap, sin click-ops). No estaba en el repo original: setup.sh
# lo menciona en show_status() pero nunca lo crea.
#
# Aplicar:
#   kubectl apply -f monitoring/grafana.yaml
# Acceder:
#   kubectl -n otel-lab port-forward svc/grafana-svc 3000:3000
#   http://localhost:3000  (admin/admin, pide cambiar password al entrar)
# ════════════════════════════════════════════════════════════════

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: otel-lab
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-svc:9090
        isDefault: true
        editable: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: otel-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        chaos.exclude: "true"
    spec:
      nodeSelector:
        rol: observabilidad
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: data
          hostPath:
            path: /var/lib/lab-grafana
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
  namespace: otel-lab
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
