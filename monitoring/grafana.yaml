# ════════════════════════════════════════════════════════════════
# monitoring/grafana.yaml
#
# Grafana con el datasource de Prometheus preconfigurado (provisioning
# por ConfigMap, sin click-ops). No estaba en el repo original: setup.sh
# lo menciona en show_status() pero nunca lo crea.
#
# Aplicar:
#   kubectl apply -f monitoring/grafana.yaml
# Acceder:
#   kubectl -n otel-lab port-forward svc/grafana-svc 3000:3000
#   http://localhost:3000  (admin/admin, pide cambiar password al entrar)
# ════════════════════════════════════════════════════════════════

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: otel-lab
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-svc:9090
        isDefault: true
        editable: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: otel-lab
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: gameday
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gameday
  namespace: otel-lab
data:
  gameday.json: |
    {
      "title": "Game Day - otel-lab",
      "uid": "gameday-otel-lab",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Latencia HTTP server (p50 / p95)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, exported_job) (rate(otelcol_http_server_duration_milliseconds_bucket[$__rate_interval])))",
              "legendFormat": "p95 {{exported_job}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.50, sum by (le, exported_job) (rate(otelcol_http_server_duration_milliseconds_bucket[$__rate_interval])))",
              "legendFormat": "p50 {{exported_job}}",
              "refId": "B"
            }
          ],
          "description": "Desglosado por servicio. En el Experimento 1 el p95 de service-b se queda bajo mientras el cliente sufre +400 ms: la latencia vive en el enlace, no en la dependencia (debilidad D2 del Plan de Game Day)."
        },
        {
          "id": 2,
          "title": "Throughput HTTP server (req/s)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (exported_job) (rate(otelcol_http_server_duration_milliseconds_count[$__rate_interval]))",
              "legendFormat": "{{exported_job}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Llamadas a inventario (service-b)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(otelcol_inventory_requests_total[$__rate_interval]))",
              "legendFormat": "inventory requests/s",
              "refId": "A"
            },
            {
              "expr": "sum(rate(otelcol_inventory_cache_hits_total[$__rate_interval]))",
              "legendFormat": "cache hits/s",
              "refId": "B"
            }
          ]
        },
        {
          "id": 4,
          "title": "Salud del pipeline OTel Collector",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(otelcol_receiver_accepted_spans[$__rate_interval]))",
              "legendFormat": "spans aceptados/s",
              "refId": "A"
            },
            {
              "expr": "sum(rate(otelcol_processor_dropped_spans[$__rate_interval]))",
              "legendFormat": "spans descartados/s",
              "refId": "B"
            },
            {
              "expr": "sum(up)",
              "legendFormat": "targets up",
              "refId": "C"
            }
          ]
        },
        {
          "id": 5,
          "title": "SLI de borde — disponibilidad por endpoint (blackbox)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "avg_over_time(probe_success{job=\"blackbox-http\"}[1m])",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "description": "Sonda HTTP desde fuera del proceso instrumentado. Es la unica fuente de este tablero que puede ver las requests abortadas por HTTPChaos: el abort ocurre en el proxy, antes de que la request llegue al codigo, asi que ni las trazas ni las metricas de la app la registran."
        },
        {
          "id": 6,
          "title": "SLI de borde — latencia de la sonda",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "probe_duration_seconds{job=\"blackbox-http\"}",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "description": "Un abort se manifiesta como corte (~0,02 s) o como cuelgue hasta el timeout."
        },
        {
          "id": 7,
          "title": "data-service — requests procesadas por la app, por replica",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (exported_instance) (rate(otelcol_data_requests_total[$__rate_interval]))",
              "legendFormat": "réplica {{exported_instance}}",
              "refId": "A"
            },
            {
              "expr": "sum(rate(otelcol_data_requests_total[$__rate_interval]))",
              "legendFormat": "TOTAL registrado por la app",
              "refId": "B"
            }
          ],
          "description": "Una serie por replica (service.instance.id). Durante el chaos NINGUNA baja: el HTTPChaos usa target: Response, o sea que aborta en el camino de vuelta. La aplicacion procesa la request, responde 200 y emite su span; el cliente nunca recibe la respuesta. Por eso el APM no muestra un hueco sino exito."
        },
        {
          "id": 8,
          "title": "Blind spot — quien ve la falla",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "100 * (1 - avg_over_time(probe_success{job=\"blackbox-http\", instance=\"http://data-service-svc:8002/data/products\"}[2m]))",
              "legendFormat": "error rate visto desde el borde",
              "refId": "A"
            },
            {
              "expr": "100 * (sum(rate(otelcol_http_server_duration_milliseconds_count{exported_job=\"data-service\", http_status_code=~\"5..\"}[2m])) / sum(rate(otelcol_http_server_duration_milliseconds_count{exported_job=\"data-service\"}[2m]))) or vector(0)",
              "legendFormat": "error rate visto por el APM (5xx)",
              "refId": "B"
            }
          ],
          "description": "Las dos lineas miden el mismo incidente. La del APM se queda en 0 porque la aplicacion respondio 200 a todas: el corte ocurre despues, en la conexion."
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: otel-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        chaos.exclude: "true"
    spec:
      nodeSelector:
        rol: observabilidad
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-gameday
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provisioning
          configMap:
            name: grafana-dashboard-provisioning
        - name: dashboard-gameday
          configMap:
            name: grafana-dashboard-gameday
        - name: data
          hostPath:
            path: /var/lib/lab-grafana
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
  namespace: otel-lab
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
