apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: otel-lab
data:
  loki-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      # Lab de corta duracion por corrida -- no necesitamos retencion larga
      # ni limites de ingestion agresivos; si queremos ver logs recien
      # llegados sin esperar el flush por defecto.
      allow_structured_metadata: true
      reject_old_samples: false
      volume_enabled: true

    compactor:
      working_directory: /loki/compactor
