apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: otel-lab
data:
  prometheus.yaml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s
      external_labels:
        cluster:     otel-lab-chaos
        environment: production

    rule_files:
      # El ConfigMap completo (prometheus-config) se monta plano en
      # /etc/prometheus (un solo volumeMount de directorio, ver
      # base/02-deployments.yaml) -- rules.yaml queda ahi mismo, sin
      # subcarpeta. Un segundo volumeMount con subPath para forzar una
      # subcarpeta "rules/" no funciona: no se puede anidar un mount de
      # subPath dentro de un path ya gobernado por un mount de todo el
      # volumen ("not a directory" en runc). Bug real, no cosmetico:
      # antes de este fix, /api/v1/rules devolvia groups:[] sin ningun
      # error en el log -- las reglas de U2 nunca se cargaron.
      - /etc/prometheus/rules.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager-svc:9093"]

    scrape_configs:
      # OTel Collector — metricas de aplicacion (puerto 8889)
      #
      # El Collector es un DaemonSet de 3 replicas detras de un unico
      # Service ClusterIP. Si se scrapea el Service (otel-collector-svc),
      # kube-proxy balancea cada scrape a una replica al azar via
      # round-robin de conexion — como las apps mantienen su conexion
      # gRPC OTLP pegada a UNA sola replica, casi siempre se termina
      # scrapeando una replica distinta a la que tiene los datos, y las
      # metricas de aplicacion (http_requests_total, inventory.*, etc.)
      # aparecen intermitentes o directamente ausentes. Fix: descubrir
      # los 3 pods por label y scrapearlos TODOS directamente, sin pasar
      # por el Service.
      - job_name: otel-collector
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [otel-lab]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: otel-collector
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}:8889
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Metricas internas del Collector (self-telemetry, puerto 8888)
      # mismo fix: por pod, no por Service.
      - job_name: otel-collector-internal
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [otel-lab]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: otel-collector
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}:8888
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Scraping generico de pods con anotaciones prometheus.io/scrape
      # (bug original: el relabel de __address__ usaba solo el puerto,
      # perdiendo la IP del pod — quedaba "9065" en vez de "10.244.x.x:9065")
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [otel-lab]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+);(.+)
            replacement: ${1}:${2}

      # ztunnel (Istio ambient, G-07) — metricas L4 de la malla: conexiones,
      # bytes, latencia por par src/dst, sin instrumentar ningun codigo de
      # aplicacion. Corre como DaemonSet en istio-system, expone Prometheus
      # en :15020/stats/prometheus (mismo puerto/ruta que los sidecars Envoy).
      - job_name: ztunnel
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [istio-system]
        metrics_path: /stats/prometheus
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: ztunnel
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}:15020
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # waypoint proxy (Istio ambient, G-07) — metricas L7 reales: requests,
      # codigo de respuesta, latencia por servicio, generadas por el proxy
      # de la malla (Envoy) sin instrumentar la app. Este es el dato clave
      # para el experimento "blind spot" del modulo D: el mesh SI cuenta
      # el abort de un HTTPChaos que la instrumentacion de aplicacion nunca
      # llega a ver (la conexion se corta antes de tocar el codigo).
      - job_name: waypoint
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [otel-lab]
        metrics_path: /stats/prometheus
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_gateway_networking_k8s_io_gateway_name]
            action: keep
            regex: waypoint
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}:15020
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Blackbox exporter — SLI de borde, medido FUERA del proceso.
      # Ve las requests abortadas por HTTPChaos, que la instrumentacion
      # de la app no puede ver porque nunca llegan al codigo.
      # scrape cada 5s para tener resolucion durante la ventana de chaos.
      - job_name: blackbox-http
        scrape_interval: 5s
        scrape_timeout: 4s
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://data-service-svc:8002/health
              - http://data-service-svc:8002/data/products
              - http://service-a-svc:8000/health
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter-svc:9115

      # LitmusChaos metrics
      - job_name: litmus-chaos-operator
        static_configs:
          - targets: ["chaos-operator-metrics.litmus:8080"]

      # Chaos Mesh metrics
      - job_name: chaos-mesh-controller
        static_configs:
          - targets: ["chaos-controller-manager-metrics.chaos-mesh:10080"]

      # alert-enricher — alert_enriched_total{alertname, enriched} (cierra G-11)
      - job_name: alert-enricher
        static_configs:
          - targets: ["alert-enricher-svc:8080"]

  rules.yaml: |
    # Reglas reescritas contra el contrato de metricas real (docs/METRICS-CONTRACT.md,
    # cierra G-08). Las reglas anteriores apuntaban a series que no existen
    # (otelcol_http_requests_total, job="service-b") y nunca dispararon.
    groups:
      - name: aiops.baseline
        interval: 30s
        rules:
          # SLI de error, medido en la app (data-service ya trae outcome, G-09)
          - record: sli:error_rate:ratio5m
            expr: |
              1 - (
                sum by (exported_job) (rate(otelcol_data_requests_total{outcome="success"}[5m]))
                /
                sum by (exported_job) (rate(otelcol_data_requests_total[5m]))
              )

          # mu y sigma sobre 6h, DESPLAZADAS 10min para que la ventana anomala
          # no contamine su propio baseline
          - record: sli:error_rate:mu6h
            expr: avg_over_time(sli:error_rate:ratio5m[6h] offset 10m)
          - record: sli:error_rate:sigma6h
            expr: stddev_over_time(sli:error_rate:ratio5m[6h] offset 10m)

          - record: sli:latency_p99:5m
            expr: |
              histogram_quantile(0.99,
                sum by (exported_job, le) (rate(otelcol_http_server_duration_milliseconds_bucket[5m])))
              / 1000

          # SLI de disponibilidad de borde (blackbox, cierra G-12 -- ve
          # http_code=000, que el SLI de 5xx de la app nunca ve)
          - record: sli:availability:avg30d
            expr: avg_over_time(probe_success[30d])

          - alert: AIOpsCorrelatedAnomaly
            # piso absoluto (> 0.01) evita disparar cuando mu=0 y sigma~=0
            # (ruido de un solo error aislado)
            expr: |
              sli:error_rate:ratio5m > (sli:error_rate:mu6h + 2 * sli:error_rate:sigma6h)
              and sli:latency_p99:5m > 0.25
              and sli:error_rate:ratio5m > 0.01
            for: 30s
            labels:
              severity: critical
              playbook: "runbook-trace-pivot"
            annotations:
              summary: "Anomalía correlacionada en {{ $labels.exported_job }}"
              error_rate: "{{ $value | humanizePercentage }}"
              baseline: "{{ with query \"sli:error_rate:mu6h\" }}{{ . | first | value }}{{ end }}"

          # Hallazgo 3b de U2: un abort que bloquea el worker 9s hace bajar el
          # throughput y con eso el error rate (base menor) -- una regla que
          # solo mira proporcion de errores premia la corrida rota.
          - alert: ThroughputCollapse
            expr: |
              sum by (exported_job) (rate(otelcol_data_requests_total[5m]))
                < 0.7 * avg_over_time(
                    sum by (exported_job) (rate(otelcol_data_requests_total[5m]))[6h:5m] offset 10m)
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Caída de throughput en {{ $labels.exported_job }} (posible worker bloqueado)"

          - alert: ChaosLatencyDetected
            expr: |
              histogram_quantile(0.99,
                sum by (exported_job, le) (rate(otelcol_http_server_duration_milliseconds_bucket{exported_job="service-b"}[2m])))
              / 1000 > 0.25
            for: 30s
            labels:
              severity: warning
              experiment: chaos-mesh-network-latency
            annotations:
              summary: "Latencia anómala en service-b — Chaos Mesh activo"

          - alert: HighBurnRate_PAGE
            expr: |
              (
                sum by (exported_job) (rate(otelcol_data_requests_total{outcome="error"}[1h]))
                /
                sum by (exported_job) (rate(otelcol_data_requests_total[1h]))
              ) / 0.005 > 14.4
            for: 0m
            labels:
              severity: critical
              page: "true"
            annotations:
              summary: "Burn rate crítico en {{ $labels.exported_job }} — error budget agotándose"
