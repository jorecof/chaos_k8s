apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: otel-lab
data:
  prometheus.yaml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s
      external_labels:
        cluster:     otel-lab-chaos
        environment: production

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      # OTel Collector — metricas de aplicacion (puerto 8889)
      #
      # El Collector es un DaemonSet de 3 replicas detras de un unico
      # Service ClusterIP. Si se scrapea el Service (otel-collector-svc),
      # kube-proxy balancea cada scrape a una replica al azar via
      # round-robin de conexion — como las apps mantienen su conexion
      # gRPC OTLP pegada a UNA sola replica, casi siempre se termina
      # scrapeando una replica distinta a la que tiene los datos, y las
      # metricas de aplicacion (http_requests_total, inventory.*, etc.)
      # aparecen intermitentes o directamente ausentes. Fix: descubrir
      # los 3 pods por label y scrapearlos TODOS directamente, sin pasar
      # por el Service.
      - job_name: otel-collector
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [otel-lab]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: otel-collector
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}:8889
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Metricas internas del Collector (self-telemetry, puerto 8888)
      # mismo fix: por pod, no por Service.
      - job_name: otel-collector-internal
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [otel-lab]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: otel-collector
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}:8888
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Scraping generico de pods con anotaciones prometheus.io/scrape
      # (bug original: el relabel de __address__ usaba solo el puerto,
      # perdiendo la IP del pod — quedaba "9065" en vez de "10.244.x.x:9065")
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [otel-lab]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+);(.+)
            replacement: ${1}:${2}

      # Blackbox exporter — SLI de borde, medido FUERA del proceso.
      # Ve las requests abortadas por HTTPChaos, que la instrumentacion
      # de la app no puede ver porque nunca llegan al codigo.
      # scrape cada 5s para tener resolucion durante la ventana de chaos.
      - job_name: blackbox-http
        scrape_interval: 5s
        scrape_timeout: 4s
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://data-service-svc:8002/health
              - http://data-service-svc:8002/data/products
              - http://service-a-svc:8000/health
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter-svc:9115

      # LitmusChaos metrics
      - job_name: litmus-chaos-operator
        static_configs:
          - targets: ["chaos-operator-metrics.litmus:8080"]

      # Chaos Mesh metrics
      - job_name: chaos-mesh-controller
        static_configs:
          - targets: ["chaos-controller-manager-metrics.chaos-mesh:10080"]

  rules.yaml: |
    groups:
      - name: aiops.anomaly_detection
        interval: 30s
        rules:
          - record: job:error_rate:baseline_1h
            expr: |
              avg_over_time(
                (rate(otelcol_http_requests_total{status=~"5.."}[5m])
                 / rate(otelcol_http_requests_total[5m]))[1h:5m]
              )

          - record: job:latency_p99:current
            expr: |
              histogram_quantile(0.99,
                rate(otelcol_http_request_duration_seconds_bucket[5m])
              )

          - alert: AIOpsCorrelatedAnomaly
            expr: |
              (
                rate(otelcol_http_requests_total{status=~"5.."}[5m])
                / rate(otelcol_http_requests_total[5m])
              ) > (job:error_rate:baseline_1h * 3)
              AND
              job:latency_p99:current > 0.25
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Anomalía correlacionada — Chaos experiment activo"
              description: "Error rate y latencia p99 anómalos simultáneamente"

          - alert: ChaosLatencyDetected
            expr: |
              histogram_quantile(0.99,
                rate(otelcol_http_request_duration_seconds_bucket{job="service-b"}[2m])
              ) > 0.25
            for: 30s
            labels:
              severity: warning
              experiment: chaos-mesh-network-latency
            annotations:
              summary: "Latencia anómala en service-b — Chaos Mesh activo"

          - alert: HighBurnRate_PAGE
            expr: |
              (
                rate(otelcol_http_requests_total{status=~"5.."}[1h])
                / rate(otelcol_http_requests_total[1h])
              ) / 0.005 > 14.4
            for: 0m
            labels:
              severity: critical
              page: "true"
            annotations:
              summary: "Burn rate crítico — error budget agotándose"
