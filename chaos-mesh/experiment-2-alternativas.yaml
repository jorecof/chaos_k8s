# Alternativas / extra credit del Experimento 2 (PodChaos, StressChaos,
# Schedule). NO forman parte del Experimento 2 en si -- se separaron de
# experiment-2-http-error.yaml para evitar aplicar 4 objetos de chaos a
# la vez (mismo bug que tuvo el Experimento 1).
# ════════════════════════════════════════════════════════════════
# Alternativa: PodChaos (pod failure) para data-service
# Más drástico — elimina pods directamente
# Útil para probar que el sistema funciona con N-1 réplicas
# ════════════════════════════════════════════════════════════════
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-failure-data-service
  namespace: otel-lab
  annotations:
    experiment.chaos/type: "pod-failure"
    experiment.chaos/use-when: "verificar alta disponibilidad con N-1 pods"
spec:
  action: pod-failure    # Marca el pod como no saludable (simula crash)
  # Alternativa: pod-kill (elimina el pod, K8s lo recrea)
  # action: pod-kill

  mode: one              # Solo afectar UN pod a la vez
  # Blast radius: no matar más del 50% de las réplicas simultáneamente

  selector:
    namespaces:
      - otel-lab
    labelSelectors:
      "app": "data-service"

  duration: "2m"

---
# ════════════════════════════════════════════════════════════════
# StressChaos: stress de CPU en service-a
# Útil para verificar el panel de CPU overhead del dashboard
# ════════════════════════════════════════════════════════════════
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-service-a
  namespace: otel-lab
  annotations:
    experiment.chaos/type: "cpu-stress"
    experiment.chaos/objective: "verificar alertas de CPU y panel 5 de Grafana"
spec:
  mode: one
  selector:
    namespaces:
      - otel-lab
    labelSelectors:
      "app": "service-a"

  stressors:
    cpu:
      workers: 2      # 2 threads de stress de CPU
      load: 60        # 60% de carga de CPU
    memory:
      workers: 1
      size: "128MB"   # Consumir 128MB adicionales de memoria

  duration: "3m"

---
# ════════════════════════════════════════════════════════════════
# Schedule: ejecutar experimentos en horario programado
# Útil para chaos continuo controlado en horario de oficina
# ════════════════════════════════════════════════════════════════
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: scheduled-chaos-business-hours
  namespace: otel-lab
spec:
  schedule: "0 10,14 * * MON-FRI"  # 10am y 2pm en días hábiles
  type: NetworkChaos
  historyLimit: 5
  concurrencyPolicy: Forbid          # No ejecutar si hay un chaos activo
  networkChaos:
    action: delay
    mode: one                         # Solo 1 pod a la vez en horario
    selector:
      namespaces: [otel-lab]
      labelSelectors:
        app: service-b
    delay:
      latency: "150ms"
      correlation: "80"
    direction: both
    duration: "5m"
